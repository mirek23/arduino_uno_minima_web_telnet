; PlatformIO Project Configuration
; Arduino UNO R4 Minima - Web/Telnet Server with W5500 Ethernet
;
; Renesas RA4M1 @ 48 MHz, 256 KB flash, 32 KB RAM, 8 KB data-flash "EEPROM".
;
; Build:            pio run
; Upload (DFU/USB): pio run -t upload
; Serial monitor:   pio device monitor
;
; There is no filesystem partition on this board: the web assets in data/ are
; compiled into flash by tools/gen_web_assets.py (run automatically pre-build).

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino

; Regenerate src/web_assets.cpp from data/*.html|css|js before every build
extra_scripts = pre:tools/gen_web_assets.py

; Libraries
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    arduino-libraries/Ethernet @ ^2.0.2

; The LCD1602 PCF8574 backpack is driven by src/lcd_display.cpp (no library).

build_flags =
    -Wall

; Serial monitor
monitor_speed = 115200
